<!DOCTYPE html>
<html lang="ja">

<style>
  :root { --bg: #111; --text: #f0f0f0; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'FOT-大江戸勘亭流 Std E', 'Yuji Syuku', 'Hiragino Kaku Gothic ProN', serif; user-select: none; }
  body { background-color: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

  #start-screen, #battle-screen { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; flex-direction: column; }
  #start-screen { justify-content: center; align-items: center; z-index: 1000; background: var(--bg); }
  h1 { font-size: 3.5rem; color: #ffcc00; text-shadow: 0 0 10px #ff6600, 0 0 20px #cc0000; margin-bottom: 2rem; }
  .mode-btn { background: linear-gradient(45deg, #ff512f, #dd2476); color: white; border: none; padding: 12px 35px; font-size: 1.3rem; margin: 10px; border-radius: 30px; cursor: pointer; transition: 0.1s; }
  .mode-btn:hover { transform: scale(1.05); }

  #battle-screen { display: none; background: radial-gradient(circle at center, #222 0%, #000 100%); }
  .header { display: flex; justify-content: space-between; padding: 8px 25px; background: rgba(0,0,0,0.8); z-index: 10; border-bottom: 2px solid #444; }
  .gauge-container { width: 45%; }
  
  .gauge-bar-bg { width: 100%; height: 28px; background: #222; border-radius: 15px; border: 2px solid #666; position: relative; box-shadow: inset 0 0 10px #000; margin-top: 3px; }
  .gauge-bar-preview { position: absolute; left: 0; top: 0; height: 100%; background: rgba(0, 255, 255, 0.6); border-radius: 15px; width: 0%; z-index: 1; display: none; animation: gaugeBlink 0.6s infinite alternate; }
  @keyframes gaugeBlink { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }
  .gauge-bar-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; border-radius: 15px; transition: width 0.5s; background: linear-gradient(180deg, #ff6666, #cc0000); z-index: 2; }
  .tamashii-icon { position: absolute; right: -12px; top: -4px; width: 32px; height: 32px; background: radial-gradient(circle, #fff, #ffcc00); border: 2px solid #ff0000; border-radius: 50%; color: #ff0000; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; box-shadow: 0 0 8px #ffcc00; z-index: 15; text-shadow: none;}
  .gauge-clear-line { position: absolute; left: 80%; top: -2px; width: 3px; height: 28px; background: #fff; box-shadow: 0 0 5px #fff; z-index: 5; }
  .gauge-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-shadow: 1px 1px 2px black; font-size: 1rem; z-index: 10; color: #fff; font-family: sans-serif; font-weight: bold; }

  .arena { flex-grow: 1; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  
  /* 左上のBPM表示 */
  #bpm-target-display { position: absolute; top: 15px; left: 20px; font-size: 1.3rem; color: #00ffff; text-shadow: 0 0 8px #0088ff; z-index: 10; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; border: 1px solid #0088ff; }

  /* フィールドを上に移動＆サイズ縮小 */
  .field-area { display: flex; gap: 320px; justify-content: center; align-items: center; margin-top: -60px; position: relative; width: 100%; }
  .field-container { display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5;}
  .sub-slots { display: flex; gap: 8px; min-height: 120px; justify-content: center; align-items: flex-end; }
  .field-slot { width: 110px; height: 160px; border: 2px dashed #666; border-radius: 6px; display: flex; justify-content: center; align-items: center; position: relative; color: #666; font-size: 1rem; background: rgba(0,0,0,0.5); }
  .matchup-badge { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 1rem; padding: 2px 8px; border-radius: 8px; z-index: 40; display: none; white-space: nowrap; }

  .ui-panel { background: rgba(0,0,0,0.8); padding: 8px 25px; border-radius: 30px; border: 2px solid #ffcc00; color: #ffcc00; font-size: 1.1rem; margin-top: 20px; z-index: 50; display: flex; gap: 15px; align-items: center; }
  .action-btn { background: #ffcc00; color: #000; border: none; padding: 8px 20px; font-size: 1.1rem; border-radius: 15px; cursor: pointer; transition: 0.2s; }
  .action-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
  .pass-btn { background: #444; color: #fff; border: 1px solid #777; }
  .pass-btn:hover { background: #555; }

  .hand-wrapper { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: space-around; z-index: 20; }
  .hand-section { display: flex; flex-direction: column; align-items: center; }
  .hand-label { font-size: 0.9rem; color: #ccc; margin-bottom: 3px; text-shadow: 0 0 3px #000; }
  .hand-area { display: flex; gap: 5px; height: 170px; align-items: flex-end; }
  
  /* カードサイズ縮小 */
  .card { width: 110px; height: 160px; background: #2a2a2a; border: 2px solid #444; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
  .card:not(.unplayable):hover { transform: translateY(-10px); z-index: 30; }
  .card.selected { box-shadow: 0 0 15px #ffcc00 !important; transform: translateY(-15px); z-index: 35; border-color: #ffcc00 !important; }
  .card.unplayable { opacity: 0.5; filter: grayscale(80%); } 
  .card-sub { width: 85px; height: 120px; border-color: #aaa; background: #1a1a2e; overflow: visible; }
  
  /* 段位エフェクト＆キラキラアニメ */
  .card.dan-gold { border: 2px solid #ffd700 !important; box-shadow: 0 0 10px rgba(255, 215, 0, 0.6); background: linear-gradient(135deg, #4aa00, #1a1a1a) !important; }
  .card.dan-silver { border: 2px solid #c0c0c0 !important; box-shadow: 0 0 10px rgba(192, 192, 192, 0.6); background: linear-gradient(135deg, #2a2a3a, #1a1a1a) !important; }
  .card.dan-red { border: 2px solid #ff3333 !important; box-shadow: 0 0 10px rgba(255, 51, 51, 0.6); background: linear-gradient(135deg, #3a1a1a, #1a1a1a) !important; }
  .card.dan-rainbow { border: 2px solid transparent !important; background-image: linear-gradient(#1a1a1a, #1a1a1a), linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3) !important; background-origin: border-box !important; background-clip: padding-box, border-box !important; animation: rainbowGlow 2s linear infinite; }
  
  /* キラキラ光るエフェクト */
  .card.dan-gold::before, .card.dan-silver::before, .card.dan-red::before, .card.dan-rainbow::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%); transform: rotate(30deg); animation: shine 3s infinite; pointer-events: none; z-index: 1; }
  @keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }
  @keyframes rainbowGlow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

  .draw-anim { animation: drawSlide 0.4s ease-out forwards; }
  @keyframes drawSlide { 0% { transform: translateY(80px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .slide-up-sub { animation: slideUpSub 0.5s ease-out forwards; }
  @keyframes slideUpSub { 0% { transform: translateY(100px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

  /* テキストの最適化 */
  .card-header { font-size: 0.65rem; display: flex; justify-content: space-between; border-bottom: 1px solid #555; padding-bottom: 2px; position: relative; z-index: 2; }

  .card-title { font-size: 0.75rem; text-align: center; line-height: 1.1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; margin: auto 0; font-family: sans-serif; position: relative; z-index: 2; }
  .card-stats { font-size: 0.65rem; color: #aaa; text-align: center; background: rgba(0,0,0,0.5); border-radius: 3px; font-family: sans-serif; padding: 2px; position: relative; z-index: 2; }
  .card-combo { font-size: 1.1rem; color: #ff5555; text-align: center; font-family: sans-serif; font-weight: bold; position: relative; z-index: 2; }

  .search-icon { position: absolute; top: 2px; right: 2px; font-size: 0.8rem; background: #fff; border-radius: 50%; width: 16px; height: 16px; display: flex; justify-content: center; align-items: center; color: #000; }
  .sub-tooltip { position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); width: 140px; background: rgba(0,0,0,0.9); border: 1px solid #ffcc00; padding: 5px; font-size: 0.75rem; color: #fff; border-radius: 5px; display: none; z-index: 100; font-family: sans-serif; text-align: left; }
  .card-sub:hover .sub-tooltip { display: block; }

  .type-1 { border-color: #ff5555; } .type-1 .card-genre { color: #ff5555; }
  .type-2 { border-color: #5555ff; } .type-2 .card-genre { color: #5555ff; }
  .type-3 { border-color: #55ff55; } .type-3 .card-genre { color: #55ff55; }
  .type-4 { border-color: #bb55ff; } .type-4 .card-genre { color: #bb55ff; }
  .type-5 { border-color: #ffaa00; } .type-5 .card-genre { color: #ffaa00; }

  #banner-desc { font-size: 1.2rem; color: #ccc; margin-bottom: 15px; }
  #play-mode-btns { display: flex; flex-direction: row; gap: 15px; justify-content: space-between; align-items: stretch; width: 100%; }
  .play-btn-box { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .prob-detail { background: #111; border: 1px solid #444; border-radius: 6px; padding: 8px; font-size: 0.9rem; text-align: left; color: #ddd; line-height: 1.4; flex-grow: 1; font-family: sans-serif; font-weight: bold; }
  .blink-text { animation: blinker 0.8s linear infinite; }

  // --- Web Audio API (SE) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSE(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if (type === 'don') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'ka') {
      osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === 'select') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'clear') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'fail') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

  function startGame(target) {
    playSE('don');

    ['p1', 'cpu'].forEach(p => {
      let main = [...SONG_DATABASE].sort(() => Math.random() - 0.5).map(c => ({...c, uid: Math.random()}));
      let sub = [];
      // アイテム偏り防止のため等倍で多数投入
      for(let i=0; i<15; i++) {
        ITEM_DATABASE.forEach(item => sub.push({...item, uid: Math.random()}));
      }
      sub.sort(() => Math.random() - 0.5);
      
      state[p].mainDeck = main; state[p].subDeck = sub;
      state[p].mainHand = state[p].mainDeck.splice(0, 5);
      state[p].subHand = state[p].subDeck.splice(0, 3);
      state[p].mainHand.forEach(c => c.isNew = true); state[p].subHand.forEach(c => c.isNew = true);
    });
    rollBpmTarget();
  }

  function rollBpmTarget() {
    let n = Math.floor(Math.random() * 26 + 5) * 10, m = Math.floor(Math.random() * 6 + 5) * 10;
    state.currentBpmMin = n; state.currentBpmMax = n + m;
    document.getElementById('bpm-target-display').innerText = `【今ターンのBPM帯】 ${state.currentBpmMin} 〜 ${state.currentBpmMax}`;
    updateUI();
  }

  function isCardPlayable(card) {
    if (card.name.includes("〆ドレー")) return true;
    if (String(card.bpm).includes('-')) {
        const parts = String(card.bpm).split('-');
        return (Number(parts[1]) >= state.currentBpmMin && Number(parts[0]) <= state.currentBpmMax);
    }
    const bpm = Number(card.bpm); return bpm >= state.currentBpmMin && bpm <= state.currentBpmMax;
  }

    renderHand('p1-main-hand', state.p1.mainHand, 'main');

    const p1Percent = Math.min((state.p1Score / state.target) * 100, 100);
    const cpuPercent = Math.min((state.cpuScore / state.target) * 100, 100);
    
    document.getElementById('p1-gauge-fill').style.width = `${p1Percent}%`;
    document.getElementById('cpu-gauge-fill').style.width = `${cpuPercent}%`;
    document.getElementById('p1-gauge-text').innerText = `${Math.floor(state.p1Score)} / ${state.target}`;

  function renderHand(containerId, cards, type) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

      if (card.isNew) { el.classList.add('draw-anim'); card.isNew = false; }

      if (type === 'main') {
        const playable = isCardPlayable(card);
        const danClass = card.dan ? `dan-${card.dan}` : '';
        el.className = `card type-${card.genre} ${state.p1.selectedMain?.uid === card.uid ? 'selected' : ''} ${playable ? '' : 'unplayable'} ${danClass}`;
        el.innerHTML = `<div class="card-header"><span class="card-rank">${card.rank}</span><span class="card-genre">${GENRE_MAP[card.genre] || "未設定"}</span></div><div class="card-title">${card.name}</div><div class="card-stats">BPM: ${card.bpm}</div><div class="card-combo">${card.combo} <span style="font-size:0.6em;">コンボ</span></div>`;
        el.onclick = () => { if(state.phase === 'SELECT_MAIN') { playSE('select'); state.p1.selectedMain = card; updatePhaseUI(); } };
      } else {
        const isSelected = state.p1.selectedSubs.find(c => c.uid === card.uid);
        el.className = `card card-sub ${isSelected ? 'selected' : ''}`;
        el.innerHTML = `<div class="search-icon">🔎</div><div class="card-title" style="color:#fff;">${card.name}</div><div class="card-stats">${card.desc}</div><div class="sub-tooltip">${card.tooltip}</div>`;
        el.onclick = () => {
          if(state.phase === 'SELECT_SUB') {
            playSE('select');
            if(isSelected) state.p1.selectedSubs = state.p1.selectedSubs.filter(c => c.uid !== card.uid);
            else if(state.p1.selectedSubs.length < 2) state.p1.selectedSubs.push(card);
            updatePhaseUI();
          }
        };
      }
      container.appendChild(el);
    });
  }

  function updatePhaseUI() {
    const text = document.getElementById('instruction-text');
    const actionBtn = document.getElementById('action-btn');

    if (state.phase === 'SELECT_MAIN') {

      if (sm) {

        else { actionBtn.disabled = true; actionBtn.innerText = "BPM対象外"; passBtn.innerText = "これを捨てて交換"; }
      } else {
        actionBtn.disabled = true; actionBtn.innerText = "楽曲決定"; passBtn.innerText = "出さずにパス";

    } else if (state.phase === 'SELECT_SUB') {
      text.innerText = `アイテム選択（現在${state.p1.selectedSubs.length}枚）`;

  function executePassPhase() {
    playSE('don');

      if (state.p1.selectedMain) {

  function confirmPhase() {

    } else if (state.phase === 'SELECT_SUB') {
      state.phase = 'BATTLE';

      if(state.cpu.subHand.length > 0 && Math.random() > 0.5) { state.cpu.selectedSubs.push(state.cpu.subHand[0]); state.cpu.subHand.shift(); }
      state.p1.subHand = state.p1.subHand.filter(c => !state.p1.selectedSubs.includes(c));

  function getCalculatedTable(card, debuffs) {
    const table = JSON.parse(JSON.stringify(ROULETTE_TABLE[card.rank])); 
    
    // 段位バフ処理 (全良確率UP)
    let danBonus = 0;
    if (card.dan === 'red') danBonus = 10;
    else if (card.dan === 'silver') danBonus = 15;
    else if (card.dan === 'gold') danBonus = 20;
    else if (card.dan === 'rainbow') danBonus = 30;

    if (danBonus > 0) {
      table[0].p += danBonus;
      let reduce = danBonus / 3;
      table[1].p = Math.max(0, table[1].p - reduce);
      table[2].p = Math.max(0, table[2].p - reduce);
      table[3].p = Math.max(0, 100 - table[0].p - table[1].p - table[2].p);
    }

    // デバフ処理
    if (debuffs.includes('detarame')) { table[0].p = Math.max(0, table[0].p - 3); table[1].p = Math.max(0, table[1].p - 5); table[2].p = Math.max(0, table[2].p - 7); } 
    else if (debuffs.includes('kimagure')) { table[0].p = Math.max(0, table[0].p - 2); table[1].p = Math.max(0, table[1].p - 3); table[2].p = Math.max(0, table[2].p - 5); }
    table[3].p = Math.max(0, 100 - (table[0].p + table[1].p + table[2].p));
    return table;
  }

  function askPlayMode(card, enemyDebuffs, elemMultiplier) {
    return new Promise(resolve => {
      playModeResolver = resolve;
      document.getElementById('banner-title').innerHTML = '演奏スタイルを選択';
      document.getElementById('banner-desc').innerHTML = '';
      
      const t = getCalculatedTable(card, enemyDebuffs);
      const detailHtml = `<span style="color:#ffcc00">全良: ${t[0].p.toFixed(1)}% (x${t[0].m})</span><br><span style="color:#aaff00">フル: ${t[1].p.toFixed(1)}% (x${t[1].m})</span><br><span style="color:#00ffff">クリ: ${t[2].p.toFixed(1)}% (x${t[2].m})</span><br><span style="color:#ff5555">失敗: ${t[3].p.toFixed(1)}% (x${t[3].m})</span>`;
      document.getElementById('prob-detail-box').innerHTML = detailHtml;

      // 段位オート倍率ボーナス
      const autoBase = card.dan ? 1.2 : 1.0;
      const autoGain = Math.floor(card.combo * elemMultiplier * autoBase);
      document.getElementById('auto-btn').innerHTML = `🤖 オート<br><span style="font-size:0.9rem; color:#ccc;">確実クリア (x${autoBase.toFixed(1)})</span><br><span class="blink-text" style="color:#00ffff; font-size:1.4rem; display:block; margin-top:5px; text-shadow:0 0 10px #00ffff;">+${autoGain} C</span>`;
      
      const prePercent = Math.min(((state.p1Score + autoGain) / state.target) * 100, 100);
      const preEl = document.getElementById('p1-gauge-preview');
      preEl.style.width = `${prePercent}%`;
      preEl.style.display = 'block';

      document.getElementById('play-mode-btns').style.display = 'flex';
      document.getElementById('center-banner').style.display = 'block';
    });
  }

  function resolvePlayMode(mode) {
    playSE('ka');
    document.getElementById('center-banner').style.display = 'none';
    document.getElementById('p1-gauge-preview').style.display = 'none'; 
    if(playModeResolver) playModeResolver(mode);
  }

  function setBadge(slotId, text, color) {
    const badge = document.getElementById(slotId + '-badge');
    badge.innerText = text; badge.style.background = color; badge.style.color = '#fff'; badge.style.display = 'block';
  }

  function renderSubSlots(player) {
    const slots = document.getElementById(`${player}-sub-slots`);
    slots.innerHTML = '';
    state[player].selectedSubs.forEach(sub => {
      const el = document.createElement('div');
      el.className = 'card card-sub slide-up-sub';
      el.innerHTML = `<div class="card-title" style="color:#fff;">${sub.name}</div><div class="card-stats">${sub.desc}</div>`;
      slots.appendChild(el);
    });
  }

  async function executeBattle() {
    const p1M = state.p1.selectedMain, cpuM = state.cpu.selectedMain;
    
    renderSubSlots('p1'); renderSubSlots('cpu');

    let itemUsed = false;
    state.p1.selectedSubs.forEach(sub => { if(sub.code === 'hs2') { playSE('clear'); state.p1Score += 200; showEffect('+200', 'p1-slot', '#00ff00'); log('YOUのHS2.0発動！'); itemUsed = true; } });
    state.cpu.selectedSubs.forEach(sub => { if(sub.code === 'hs2') { playSE('clear'); state.cpuScore += 200; showEffect('+200', 'cpu-slot', '#00ff00'); log('CPUのHS2.0発動！'); itemUsed = true; } });
    if(itemUsed) { updateUI(); await sleep(1000); }

    if (!p1M && !cpuM) {
      playSE('fail');
      await showBanner('両者パス！', 'ターンを終了します', 2000);
      return resetTurn();
    }
    
    playSE('don');
    if (p1M) {
      const danClass = p1M.dan ? `dan-${p1M.dan}` : '';
      document.getElementById('p1-slot').innerHTML = `<div class="matchup-badge" id="p1-badge"></div><div class="card type-${p1M.genre} ${danClass}"><div class="card-header"><span class="card-rank">${p1M.rank}</span><span class="card-genre">${GENRE_MAP[p1M.genre]||"未設定"}</span></div><div class="card-title">${p1M.name}</div><div class="card-combo">${p1M.combo} <span style="font-size:0.6em;">コンボ</span></div></div>`;
    }
    if (cpuM) {
      const danClass = cpuM.dan ? `dan-${cpuM.dan}` : '';
      document.getElementById('cpu-slot').innerHTML = `<div class="matchup-badge" id="cpu-badge"></div><div class="card type-${cpuM.genre} ${danClass}"><div class="card-header"><span class="card-rank">${cpuM.rank}</span><span class="card-genre">${GENRE_MAP[cpuM.genre]||"未設定"}</span></div><div class="card-title">${cpuM.name}</div><div class="card-combo">${cpuM.combo} <span style="font-size:0.6em;">コンボ</span></div></div>`;
    }
    
    await showBanner('楽曲オープン！', '', 1500);

    let p1Elem = 1.0, cpuElem = 1.0;
    if (p1M && cpuM && p1M.genre !== "" && cpuM.genre !== "") {
      if((p1M.genre==1 && cpuM.genre==4) || (p1M.genre==4 && cpuM.genre==2) || (p1M.genre==2 && cpuM.genre==1)) { p1Elem=1.1; cpuElem=0.9; }
      else if((cpuM.genre==1 && p1M.genre==4) || (cpuM.genre==4 && p1M.genre==2) || (cpuM.genre==2 && p1M.genre==1)) { cpuElem=1.1; p1Elem=0.9; }
      if(p1Elem > 1.0) { setBadge('p1', '有利 (x1.1)', '#ff0000'); setBadge('cpu', '不利 (x0.9)', '#0000ff'); }
      else if(cpuElem > 1.0) { setBadge('cpu', '有利 (x1.1)', '#ff0000'); setBadge('p1', '不利 (x0.9)', '#0000ff'); }
      else { setBadge('p1', '等倍 (x1.0)', '#555'); setBadge('cpu', '等倍 (x1.0)', '#555'); }
    } else if(p1M && cpuM) {
      setBadge('p1', '等倍 (x1.0)', '#555'); setBadge('cpu', '等倍 (x1.0)', '#555');
    }

    let first = 'p1';
    if(p1M && cpuM) { first = (getEffectiveBPM(cpuM) > getEffectiveBPM(p1M) || (getEffectiveBPM(cpuM) === getEffectiveBPM(p1M) && cpuM.combo > p1M.combo)) ? 'cpu' : 'p1'; } 
    else if (!p1M) { first = 'cpu'; }
    
    if (p1M && cpuM) await showBanner(`先攻は <span style="color:#ffcc00">${first === 'p1' ? 'YOU' : 'CPU'}</span> !`, 'BPM/コンボ数比較', 1800);

    let p1Debuffs = state.cpu.selectedSubs.map(s => s.code), cpuDebuffs = state.p1.selectedSubs.map(s => s.code);

    if (first === 'p1') {
      if(p1M) await processTurn('p1', p1M, p1Elem, p1Debuffs);
      if(state.p1Score >= state.target) return endGame('YOU WIN!! (先攻逃げ切り)');
      if(cpuM) await processTurn('cpu', cpuM, cpuElem, cpuDebuffs);
    } else {
      if(cpuM) await processTurn('cpu', cpuM, cpuElem, cpuDebuffs);
      if(state.cpuScore >= state.target) return endGame('CPU WIN... (先攻逃げ切り)');
      if(p1M) await processTurn('p1', p1M, p1Elem, p1Debuffs);
    }

    if(state.p1Score >= state.target || state.cpuScore >= state.target) {
      if(state.p1Score >= state.target) endGame('YOU WIN!!');
      else endGame('CPU WIN...');
      return;
    }
    resetTurn();
  }

  async function processTurn(player, card, elemMultiplier, debuffs) {
    const isP1 = player === 'p1';
    
    await showBanner(
      `<span style="color:${isP1?'#ffcc00':'#0088ff'}">【${isP1 ? 'YOU' : 'CPU'} のターン】</span>`, 
      `<span style="font-size:1.6rem;">${card.name}</span><br><span style="font-size:1.3rem; color:#ff5555; font-weight:bold; font-family:sans-serif;">${card.combo} コンボ</span>`, 
      3000
    );

    let mode = isP1 ? await askPlayMode(card, debuffs, elemMultiplier) : (Math.random() > 0.15 ? 'manual' : 'auto');
    let resultName = '', resultMulti = 1.0, color = '#fff';

    if (mode === 'auto') {
      resultName = 'オートクリア'; resultMulti = card.dan ? 1.2 : 1.0; color = '#00ffff'; playSE('don');
    } else {
      const table = getCalculatedTable(card, debuffs);
      let rand = Math.random() * 100, acc = 0, res = table[3];
      for(let i=0; i<4; i++) { acc += table[i].p; if(rand <= acc) { res = table[i]; break; } }
      resultName = res.n; resultMulti = res.m;
      color = resultName === '全良' ? '#ffcc00' : resultName === 'フルコン' ? '#aaff00' : resultName === 'クリア' ? '#00ffff' : '#ff5555';
      if(resultName === '全良') playSE('clear');
      else if(resultName === '失敗') playSE('fail');
      else playSE('don');
    }

    await showBanner(`<span style="color:${color}; font-size:3.5rem; text-shadow: 0 0 15px ${color};">${resultName}</span>`, `倍率 x${resultMulti.toFixed(1)}`, 2000);

    let gain = Math.floor(card.combo * elemMultiplier * resultMulti);
    if(isP1) state.p1Score += gain; else state.cpuScore += gain;
    
    showEffect(`+${gain}`, isP1 ? 'p1-slot' : 'cpu-slot', '#00ff00');
    log(`${isP1 ? 'YOU' : 'CPU'}: ${resultName} (+${gain}点)`);
    updateUI();
    await sleep(1000);
  }

  async function resetTurn() {
    state.p1.selectedMain = null; state.p1.selectedSubs = []; state.p1.passed = false;
    state.cpu.selectedMain = null; state.cpu.selectedSubs = []; state.cpu.passed = false;
    
    document.getElementById('p1-slot').innerHTML = '<div class="matchup-badge" id="p1-badge"></div>Player Field';
    document.getElementById('cpu-slot').innerHTML = '<div class="matchup-badge" id="cpu-badge"></div>CPU Field';
    document.getElementById('p1-sub-slots').innerHTML = '';
    document.getElementById('cpu-sub-slots').innerHTML = '';
    document.getElementById('p1-badge').style.display = 'none';
    document.getElementById('cpu-badge').style.display = 'none';
    document.getElementById('pass-btn').disabled = false;

    log("=== ドロー＆お題更新 ===");
    drawCard('p1', 'main', 7); drawCard('p1', 'sub', 5);
    drawCard('cpu', 'main', 7); drawCard('cpu', 'sub', 5);
    
    rollBpmTarget();
    state.phase = 'SELECT_MAIN';
    updatePhaseUI();
  }

  function drawCard(player, type, limit) {
    let hand = type === 'main' ? state[player].mainHand : state[player].subHand;
    let deck = type === 'main' ? state[player].mainDeck : state[player].subDeck;
    if (hand.length >= limit) {
      if(player === 'p1' && confirm(`${type==='main'?'楽曲':'アイテム'}手札が上限(${limit}枚)です。一番古いカードを捨てて引きますか？`)) { 
        hand.shift(); let c = deck.pop(); c.isNew = true; hand.push(c); 
      }
      else if(player === 'cpu') { hand.shift(); let c = deck.pop(); c.isNew = true; hand.push(c); }
    } else { 
      if(deck.length > 0) { let c = deck.pop(); c.isNew = true; hand.push(c); }
    }
  }

  function showEffect(text, slotId, color = 'red') {
    const slot = document.getElementById(slotId);
    const rect = slot.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'effect-text';
    el.innerText = text;
    el.style.color = color;
    el.style.left = `${rect.left + rect.width/2}px`;
    el.style.top = `${rect.top}px`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }

  function log(msg) { const box = document.getElementById('battle-log'); box.innerHTML += `<p>${msg}</p>`; box.scrollTop = box.scrollHeight; }
  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
  function endGame(msg) { playSE('clear'); setTimeout(() => { alert(`ゲーム終了: ${msg}`); location.reload(); }, 1500); }

</script>
</body>
